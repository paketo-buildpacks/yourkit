api = "0.7"

[buildpack]
  description = "A Cloud Native Buildpack that contributes the YourKit Agent and configures it to connect to the service"
  homepage = "https://github.com/paketo-buildpacks/yourkit"
  id = "paketo-buildpacks/yourkit"
  keywords = ["yourkit", "agent", "profiler"]
  name = "Paketo Buildpack for YourKit"
  sbom-formats = ["application/vnd.syft+json", "application/vnd.cyclonedx+json"]
  version = "{{.version}}"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/yourkit/blob/main/LICENSE"

[metadata]
  include-files = ["LICENSE", "NOTICE", "README.md", "yourkit.png", "linux/amd64/bin/build", "linux/amd64/bin/detect", "linux/amd64/bin/run", "linux/amd64/bin/helper", "linux/arm64/bin/build", "linux/arm64/bin/detect", "linux/arm64/bin/run", "linux/arm64/bin/helper", "buildpack.toml"]
  pre-package = "scripts/build.sh --target linux/amd64 --target linux/arm64"

  [[metadata.configurations]]
    default = "10001"
    description = "what port the YourKit agent will listen on"
    launch = true
    name = "$BPL_YOURKIT_PORT"

  [[metadata.configurations]]
    description = "the name of the YourKit session"
    launch = true
    name = "BPL_YOURKIT_SESSION_NAME"

  [[metadata.configurations]]
    build = true
    description = "whether to contribute YourKit support"
    name = "BP_YOURKIT_ENABLED"

  [[metadata.dependencies]]
    arch = "amd64"
    checksum = "sha256:bd51af153b6791e47db05e43ff4e38cc4cf5fc30bfb8577e99cd16fce2761af1"
    cpe = "cpe:2.3:a:yourkit:java_profiler:2026.9.149:*:*:*:*:*:*:*"
    id = "yourkit-java"
    name = "YourKit Java Agent"
    os = "linux"
    purl = "pkg:generic/yourkit-java-profiler@2026.9.149?arch=amd64"
    sha256 = "bd51af153b6791e47db05e43ff4e38cc4cf5fc30bfb8577e99cd16fce2761af1"
    stacks = ["*"]
    uri = "https://download.yourkit.com/yjp/2026.9.149/YourKit-Java-Profiler-2026.9.149-x64.zip"
    version = "2026.9.149"

    [[metadata.dependencies.licenses]]
      uri = "https://www.yourkit.com/purchase/eula.pdf"

  [[metadata.dependencies]]
    arch = "arm64"
    checksum = "sha256:34646b835f326e267a3b1618bf2d1ff91f332e09fcac54a7573c7927ba18cdb0"
    cpe = "cpe:2.3:a:yourkit:java_profiler:2026.9.149:*:*:*:*:*:*:*"
    id = "yourkit-java"
    name = "YourKit Java Agent"
    os = "linux"
    purl = "pkg:generic/yourkit-java-profiler@2026.9.149?arch=arm64"
    sha256 = "34646b835f326e267a3b1618bf2d1ff91f332e09fcac54a7573c7927ba18cdb0"
    stacks = ["*"]
    uri = "https://download.yourkit.com/yjp/2026.9.149/YourKit-Java-Profiler-2026.9.149-arm64.zip"
    version = "2026.9.149"

    [[metadata.dependencies.licenses]]
      uri = "https://www.yourkit.com/purchase/eula.pdf"

  [[metadata.dependency-constraints]]
    constraint = "2026.*"
    id = "yourkit-java"
    patches = 2

[[stacks]]
  id = "*"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
